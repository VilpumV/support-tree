<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Скрипты техподдержки</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 640px; 
      margin: 20px auto; 
      color: #333; 
    }
    h2 { 
      text-align: center; 
    }
    .node { 
      margin-bottom: 12px; 
    }
    .answer-btn {
      display: inline-block;
      margin: 4px 0;
      padding: 8px 14px;
      background: #f5f5f5;
      border: 1px solid #ccc;
      cursor: pointer;
      border-radius: 6px;
      user-select: none;
    }
    .children { 
      display: none; 
      margin-left: 20px; 
      margin-top: 6px; 
    }
    .active-children { 
      display: block; 
    }
    .answer-btn.active {
      background: #e0ffe0;
      border-color: #4caf50;
      color: #0a5713;
    }
    .operator-text {
      padding: 10px;
      background: #fafafa;
      border-left: 4px solid #4a90e2;
      font-size: 0.95rem;
    }
    /* Стиль для кнопки сброса */
    .reset-btn {
      display: inline-block;
      margin: 4px 0 16px 0;
      padding: 8px 14px;
      background: #fff;
      border: 1px solid #ff5252;
      color: #ff5252;
      cursor: pointer;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .reset-btn:hover {
      background: #ffebee;
      border-color: #d32f2f;
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <!-- Кнопка сброса дерева -->
  <a href="" class="reset-btn" onclick="location.reload()">🔄 Начать заново (сброс дерева)</a>

  <h2>Скрипты техподдержки</h2>

  <!-- Пример узла 1 -->
  <div class="node">
    <button class="answer-btn">Проблема с треком</button>
    <div class="children">
      <div class="operator-text">Проверьте GPS и статус заказа в CRM.</div>
      <!-- Сюда можно добавлять новые кнопки внутри ветки -->
    </div>
  </div>

  <!-- Пример узла 2 -->
  <div class="node">
    <button class="answer-btn">Клиент не видит заказ</button>
    <div class="children">
      <div class="operator-text">Проверьте, не истёк ли срок хранения и статус «Доставлен».</div>
    </div>
  </div>

  <!-- Пример узла 3 -->
  <div class="node">
    <button class="answer-btn">Курьер не может проставить статус</button>
    <div class="children">
      <div class="operator-text">Попросите курьера перезагрузить приложение и проверить интернет.</div>
    </div>
  </div>

  <script>
    // Логика раскрытия веток дерева
    document.querySelectorAll('.answer-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const children = this.nextElementSibling;
        const isActive = children.classList.contains('active-children');

        // Если ветка уже открыта — закрываем её
        if (isActive) {
          children.classList.remove('active-children');
          this.classList.remove('active');
          return;
        }

        // Если ветка закрыта — открываем её
        children.classList.add('active-children');
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
